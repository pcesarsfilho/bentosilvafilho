<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0E1B33">
<title>Acompanhamento do processo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600&display=swap">
<style>
:root{--navy:#0E1B33;--gold:#C9A55A;--gold-ink:#7A5C26;--cream:#F3EBDD;--paper:#F6F1E7;--ink:#1E1E1E;--text:#3A3A3A;--line:#D9D2C3}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--text);font:400 16px/1.6 Montserrat,system-ui,sans-serif;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
header{background:var(--navy);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:22px max(16px,env(safe-area-inset-left,0px));color:var(--cream)}
header p{margin:0;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
header h1{margin:4px 0 0;font:600 1.5rem/1.2 "Cormorant Garamond",Georgia,serif}
main{max-width:560px;margin:0 auto;padding:28px 0 40px}
.card{background:#fff;border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:6px;padding:22px}
.rot{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink);margin:0 0 4px}
.fase{font:600 1.7rem/1.2 "Cormorant Garamond",Georgia,serif;color:var(--navy);margin:0 0 10px;text-wrap:balance}
.card p{margin:0 0 14px}
.bloco{border-top:1px solid var(--line);padding-top:14px;margin-top:6px}
.bloco p:last-child{margin-bottom:0}
.nota{font-size:.82rem;color:#6b6556;margin:18px 2px 0}
.rec{border-top-color:var(--navy);margin-bottom:14px;background:var(--cream)}
.btn{display:inline-block;margin-top:18px;background:var(--navy);color:var(--cream);text-decoration:none;padding:11px 18px;border-radius:4px;font-weight:600;font-size:.9rem}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
@media (prefers-color-scheme:dark){:root{--paper:#101827;--text:#d8d3c6;--line:#2c3850;--navy:#0A1426;--gold-ink:#C9A55A;--cream:#F3EBDD}.card{background:#16203a}.rec{background:#1d2a47}.fase{color:var(--cream)}.nota{color:#9a9485}}
</style>
</head>
<body>
<header><p>Bento &amp; Silva Filho Advogados</p><h1>Acompanhamento do processo</h1></header>
<main id="m"><div class="card"><p>Carregando…</p></div></main>
<script>
(function(){
  var m=document.getElementById('m');
  var WA='https://wa.me/5535988056692';
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function br(d){var p=String(d||'').split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0]:''}
  function nada(t,x){m.innerHTML='<div class="card"><p class="rot">Acompanhamento</p><h2 class="fase">'+esc(t)+'</h2><p>'+esc(x)+'</p><a class="btn" href="'+WA+'" rel="noopener">Falar com o escritório</a></div>'}
  var code=location.hash.slice(1);
  if(!/^[A-Za-z0-9]{16,64}$/.test(code)||!window.crypto||!crypto.subtle){nada('Link indisponível','Este endereço não está ativo. Fale com o advogado para receber um novo link, se for o caso.');return}
  crypto.subtle.digest('SHA-256',new TextEncoder().encode(code)).then(function(b){
    var h=Array.prototype.map.call(new Uint8Array(b),function(x){return('0'+x.toString(16)).slice(-2)}).join('');
    return fetch('d/'+h+'.json',{cache:'no-store'});
  }).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
    if(d.ate&&d.ate<new Date().toISOString().slice(0,10))throw 0;
    var enc=d.encerradoEm?'<p class="rot" style="margin-top:14px">Encerrado em '+esc(br(d.encerradoEm))+'. Este painel será desativado em breve.</p>':'';
    var rec=d.recado&&d.recado.texto?'<div class="card rec"><p class="rot">Recado do escritório'+(d.recado.data?' · '+esc(br(d.recado.data)):'')+'</p><p>'+esc(d.recado.texto)+'</p></div>':'';
    m.innerHTML=rec+'<div class="card"><p class="rot">Situação segundo o DataJud</p><h2 class="fase">'+esc(d.fase)+'</h2><p>'+esc(d.texto)+'</p>'+
      (d.data?'<p class="rot" style="margin-top:4px">Última movimentação considerada: '+esc(br(d.data))+'</p>':'')+
      '<div class="bloco"><p class="rot">Próximo passo</p><p>'+esc(d.prox)+'</p></div>'+enc+'</div>'+
      '<p class="nota"><b>Aviso.</b> Este painel segue as informações públicas do DataJud, base de dados do Conselho Nacional de Justiça, que podem levar dias para refletir os atos do processo e podem conter inconsistências. O advogado não se responsabiliza por eventual desatualização ou inconsistência dessas informações. Movimentações de rotina não são exibidas. Qualquer dúvida deve ser esclarecida diretamente com o advogado.</p>'+
      '<a class="btn" href="'+WA+'" rel="noopener">Falar com o advogado</a>';
  }).catch(function(){nada('Link indisponível','Este acompanhamento não está ativo ou foi encerrado. Fale com o advogado se precisar de informações.')});
})();
</script>
</body>
</html>
