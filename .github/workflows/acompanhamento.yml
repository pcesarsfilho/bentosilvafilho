name: Acompanhamento processual
on:
  schedule:
    - cron: '17 9 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/acompanhamento/lista.json'
permissions:
  contents: write
  pages: write
concurrency:
  group: acompanhamento
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Consultar DataJud e atualizar painéis
        env:
          DATAJUD_KEY: ${{ vars.DATAJUD_KEY }}
        run: node .github/scripts/acompanhamento.mjs
      - name: Pulso mensal (evita que o GitHub desligue a rotina por inatividade)
        run: |
          mes=$(date -u +%Y-%m)
          [ "$(cat .github/acompanhamento/pulso.txt 2>/dev/null)" = "$mes" ] || echo "$mes" > .github/acompanhamento/pulso.txt
      - name: Publicar alterações
        run: |
          git config user.name "acompanhamento-bot"
          git config user.email "acompanhamento-bot@users.noreply.github.com"
          git add -A a/d .github/acompanhamento
          if git diff --cached --quiet; then echo "sem alterações"; exit 0; fi
          git commit -m "Atualiza painéis de acompanhamento"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
        env:
          GH_TOKEN: ${{ github.token }}
